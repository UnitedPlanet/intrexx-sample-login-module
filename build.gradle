
plugins {
	id 'java-library'
}


java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}


repositories {
	mavenCentral()

	maven {
		url = 'https://maven.intrexx.com'
	}
}


dependencies {
	implementation 'org.slf4j:slf4j-api:2.0.13'
	implementation('de.uplanet.lucy:ix-common:12.+') { transitive = false }
	implementation('de.uplanet.lucy:ix-server-common:12.+') { transitive = false }
	implementation('de.uplanet.lucy:ix-server:12.+') { transitive = false }

	testImplementation 'junit:junit:4.13.2'
}
